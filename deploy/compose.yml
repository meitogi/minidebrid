# Home machine : docker compose -f deploy/compose.yml up -d --build
# frpc reaches the stream server by container name on the `web` network (see frpc-proxy.toml).
services:
  debrid-remote:
    container_name: debrid-remote
    build: ../server
    restart: unless-stopped
    env_file: ../server/.env
    # Static DNAT for WebRTC ICE : must match ICE_PORTS in .env. Docker's masquerade NAT would
    # otherwise break the STUN mapping for remote peers.
    # Fallback if the 4G test fails : replace `ports` + `networks` with `network_mode: host`
    # and set frpc's localIP to this machine's LAN IP.
    ports:
      - "50000-50019:50000-50019/udp"
    networks:
      - web

networks:
  web:
    external: true
