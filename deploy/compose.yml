# Linux home machine only : docker compose -p debrid-remote -f deploy/compose.yml up -d --build
# On macOS run the server natively (GUIDE § 5) : Docker Desktop's VM hides the Mac's addresses.
# network_mode: host : werift must see the machine's real LAN and public addresses for WebRTC ICE.
# On a bridge network it only knows its 172.x container address, and browsers got no usable path
# (offer answered, then a 20 s timeout). frpc reaches the HTTP stream server on the host's :8098
# (see frpc-proxy.toml).
# volumes : the token store's directory, not the file — the CLI replaces the file by rename, which a
# single-file bind mount would not follow. Writable by uid 1000 (the image's `node` user) :
#   docker exec debrid-remote node bin/token.js add <name>
services:
  debrid-remote:
    container_name: debrid-remote
    build: ../server
    restart: unless-stopped
    env_file: ../server/.env
    network_mode: host
    volumes:
      - ../server/data:/app/data
