- group: debrid
  name: test
  cmd: npm --prefix server test
  desc: Server unit tests (offline)

- group: debrid
  name: test-live
  cmd: npm --prefix server run test:live
  desc: Live test with the real Alldebrid key from server/.env — run from the home connection only

- group: debrid
  name: start
  cmd: npm --prefix server start
  desc: Run the server locally with server/.env

- group: debrid
  name: up
  cmd: docker compose -p debrid-remote -f deploy/compose.yml up -d --build
  desc: Build and start the home container (home machine)

- group: debrid
  name: down
  cmd: docker compose -p debrid-remote -f deploy/compose.yml down
  desc: Stop the home container (home machine)

- group: debrid
  name: logs
  cmd: docker logs --tail {{ .tail }}{{ if .follow }} -f{{ end }} debrid-remote
  desc: Home container logs
  flags:
    - name: [tail, t]
      desc: Number of lines
      default: 50
      test: $uint
    - name: [follow, f]
      desc: Follow output
      default: false
      test: $bool

- group: debrid
  name: agent
  desc: |
    macOS — the server under launchd : starts at login, restarts if it dies (GUIDE § 5).
      install | uninstall | start | stop | status | logs [-t N] [-f]
  args:
    - name: action
      desc: install, uninstall, start, stop, status or logs
      required: true
      test: ^(install|uninstall|start|stop|status|logs)$
  flags:
    - name: [tail, t]
      desc: Number of log lines (logs only)
      default: 50
      test: $uint
    - name: [follow, f]
      desc: Follow the log (logs only)
      default: false
      test: $bool
  cwd: .
  cmd: sh deploy/macos/agent.sh {{ .action }}{{ if eq .action "logs" }} -n {{ .tail }}{{ if .follow }} -f{{ end }}{{ end }}

- group: debrid
  name: token
  desc: |
    Access tokens of the home server (GUIDE § 7) — run on the home machine.
      add <name> | list | revoke <name>
    add and list print setup links : each one is a credential.
  args:
    - name: action
      desc: add, list or revoke
      required: true
      test: ^(add|list|revoke)$
    - name: name
      desc: Token name, e.g. phone-kevin (add and revoke)
      default: ""
  cwd: .
  cmd: node server/bin/token.js {{ .action }}{{ if .name }} {{ esc .name }}{{ end }}
